services:
  app:
    build: .
    image: laravel-app
    container_name: laravel-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - laravel_storage:/var/www/storage
      - laravel_cache:/var/www/bootstrap/cache
      - laravel_database:/var/www/database
      - ./:/var/www
    environment:
      - ENVIRONMENT=production

  web:
    image: nginx:alpine
    container_name: nginx-web
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx:/etc/nginx/conf.d
      - /etc/letsencrypt:/etc/letsencrypt
      - /var/www/certbot:/var/www/certbot
      - laravel_storage:/var/www/storage
      - laravel_cache:/var/www/bootstrap/cache
      - laravel_database:/var/www/database
      - ./:/var/www
    environment:
      - ENVIRONMENT=production
    depends_on:
      - app
    entrypoint: >+
      sh -c 'cp /etc/nginx/conf.d/nginx.prod.conf /etc/nginx/nginx.conf && nginx -g "daemon off;"'

  certbot:
    image: certbot/certbot
    container_name: certbot
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt
      - /var/lib/letsencrypt:/var/lib/letsencrypt
      - /var/www/certbot:/var/www/certbot
    entrypoint: /bin/sh -c
    command: "trap exit TERM; while :; do sleep 6h & wait $${!}; certbot renew --webroot -w /var/www/certbot; done"

volumes:
  laravel_storage:
    driver: local
  laravel_cache:
    driver: local
  laravel_database:
    driver: local 